- route:
    id: order-processing-route
    from:
      id: from-orders
      uri: kamelet:spring-rabbitmq-source
      parameters:
        host: "{{rabbitmq.host}}"
        port: "{{rabbitmq.port}}"
        username: "{{rabbitmq.username}}"
        password: "{{rabbitmq.password}}"
        exchangeName: orders.exchange
        queues: orders.requests
        routingKey: orders.requests
        autoDeclare: false
      steps:
        - doTry:
            id: doTry-orders
            doCatch:
              - id: catch-all
                exception: java.lang.Exception
                steps:
                  - log:
                      id: log-3194
                      message: >-
                        Error processing order ${header.CamelCorrelationId}:
                        ${exception.message}
                  - to:
                      id: send-to-dlq
                      uri: kamelet:spring-rabbitmq-sink
                      parameters:
                        host: "{{rabbitmq.host}}"
                        port: "{{rabbitmq.port}}"
                        username: "{{rabbitmq.username}}"
                        password: "{{rabbitmq.password}}"
                        exchangeName: amq.direct
                        queues: orders.dlq
                        routingKey: orders.dlq
                        autoDeclareProducer: false
            steps:
              - setHeader:
                  id: set-correlation
                  name: CamelCorrelationId
                  expression:
                    simple:
                      id: simple-2f93
                      expression: ${body.correlationId}
              - setBody:
                  id: transform-order
                  expression:
                    simple:
                      id: simple-94f6
                      expression: |
                        {
                          "customer_ID": "${body.customer_ID}",
                          "orderDate": "${date:now:yyyy-MM-dd}",
                          "orderAmount": ${body.totalAmount},
                          "currency_code": "${body.currency_code}",
                          "items": ${body.items}
                        }
              - setHeader:
                  id: set-content-type
                  name: Content-Type
                  expression:
                    constant:
                      id: constant-ac31
                      expression: application/json
              - to:
                  id: call-erp
                  uri: http
                  parameters:
                    httpMethod: POST
                    httpUri: http://erp:4004/odata/v4/simple-erp/Orders
                    connectTimeout: 5000
                    socketTimeout: 10000
              - log:
                  id: log-erp-response
                  message: >-
                    ERP response received for order
                    ${header.CamelCorrelationId}: ${body}
              - setBody:
                  id: build-response
                  expression:
                    simple:
                      id: simple-9a16
                      expression: |
                        {
                          "correlationId": "${header.CamelCorrelationId}",
                          "erpResponse": ${body}
                        }
              - to:
                  id: send-response
                  uri: kamelet:spring-rabbitmq-sink
                  parameters:
                    host: "{{rabbitmq.host}}"
                    port: "{{rabbitmq.port}}"
                    username: "{{rabbitmq.username}}"
                    password: "{{rabbitmq.password}}"
                    exchangeName: orders.exchange
                    queues: orders.responses
                    routingKey: orders.responses
                    autoDeclareProducer: false
