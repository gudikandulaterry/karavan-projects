- route:
    id: order-processing-route
    from:
      id: from-orders
      uri: kamelet:spring-rabbitmq-source
      parameters:
        host: "{{rabbitmq.host}}"
        port: "{{rabbitmq.port}}"
        username: "{{rabbitmq.username}}"
        password: "{{rabbitmq.password}}"
        exchangeName: orders.exchange
        queues: orders.requests
        routingKey: orders.requests
        autoDeclare: false
      steps:
        - unmarshal:
            id: unmarshal-c35a
            json:
              id: json-93cd
              library: Jackson
        - doTry:
            id: doTry-orders
            doCatch:
              - id: catch-all
                exception: java.lang.Exception
                steps:
                  - log:
                      id: log-3194
                      message: >-
                        Error processing order ${header.CamelCorrelationId}:
                        ${exception.message}
                  - setBody:
                      id: setBody-32a2
                      expression:
                        simple:
                          id: simple-9538
                          expression: |
                            {
                              "correlationId": "${header.CamelCorrelationId}",
                              "status": "ERROR",
                              "message": "${exception.message}"
                            }
                  - marshal:
                      id: marshal-0d04
                      json:
                        id: json-f29c
                        library: Jackson
                  - to:
                      id: send-to-dlq
                      uri: kamelet:spring-rabbitmq-sink
                      parameters:
                        host: "{{rabbitmq.host}}"
                        port: "{{rabbitmq.port}}"
                        username: "{{rabbitmq.username}}"
                        password: "{{rabbitmq.password}}"
                        queues: orders.dlq
                        routingKey: orders.dlq
                        autoDeclareProducer: false
                        exchangeName: orders.exchange
            steps:
              - setHeader:
                  id: set-correlation
                  name: CamelCorrelationId
                  expression:
                    simple:
                      id: simple-2f93
                      expression: ${body[correlationId]}
              - setBody:
                  id: transform-order
                  expression:
                    simple:
                      id: simple-94f6
                      expression: |-
                        {
                          "customer_ID": "${body[customer][id]}",
                          "orderDate": "${date:now:yyyy-MM-dd}",
                          "orderAmount": ${body[totalAmount]},
                          "currency_code": "${body[currency_code]}"
                        }
              - setHeader:
                  id: set-content-type
                  name: Content-Type
                  expression:
                    constant:
                      id: constant-ac31
                      expression: application/json
              - setHeader:
                  id: setHeader-84ac
                  name: Authorization
                  expression:
                    simple:
                      id: simple-e8b6
                      expression: Basic {{erp.basicAuth}}
              - to:
                  id: call-erp
                  uri: http
                  parameters:
                    httpMethod: POST
                    connectTimeout: 5000
                    socketTimeout: 10000
                    httpUri: >-
                      http://host.docker.internal:4004/odata/v4/simple-erp/Orders
              - log:
                  id: log-erp-response
                  message: >-
                    ERP response received for order
                    ${header.CamelCorrelationId}: ${body}
              - setBody:
                  id: build-response
                  expression:
                    simple:
                      id: simple-9a16
                      expression: |
                        {
                          "correlationId": "${header.CamelCorrelationId}",
                          "erpResponse": ${body}
                        }
              - marshal:
                  id: marshal-e6b5
                  json:
                    id: json-7636
                    library: Jackson
              - to:
                  id: send-response
                  uri: kamelet:spring-rabbitmq-sink
                  parameters:
                    host: "{{rabbitmq.host}}"
                    port: "{{rabbitmq.port}}"
                    username: "{{rabbitmq.username}}"
                    password: "{{rabbitmq.password}}"
                    exchangeName: orders.exchange
                    queues: orders.responses
                    routingKey: orders.responses
                    autoDeclareProducer: false
